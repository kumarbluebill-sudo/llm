[project]
name = "travel-llm"
version = "0.10.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "temporalio>=1.7", "psycopg[binary]>=3.2",
  "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = ["api", "agents", "saga", "disruption", "mcp_servers", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
