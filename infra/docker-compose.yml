services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: travel, POSTGRES_PASSWORD: travel, POSTGRES_DB: travel}
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  temporal:
    image: temporalio/auto-setup:1.25
    environment: [DB=postgres12, DB_PORT=5432, POSTGRES_USER=travel, POSTGRES_PWD=travel, POSTGRES_SEEDS=postgres]
    depends_on: [postgres]
    ports: ["7233:7233"]
  api:
    build: ..
    environment:
      TEMPORAL_HOST: temporal:7233
      POSTGRES_URL: postgresql://travel:travel@postgres:5432/travel
    depends_on: [postgres, temporal]
    ports: ["8000:8000"]
  worker:
    build: ..
    command: ["python", "scripts/run_worker.py"]
    environment:
      TEMPORAL_HOST: temporal:7233
      POSTGRES_URL: postgresql://travel:travel@postgres:5432/travel
    depends_on: [postgres, temporal]
